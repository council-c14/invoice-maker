# Generates InvoiceMaker.xcodeproj:  brew install xcodegen && cd ios && xcodegen
name: InvoiceMaker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple team ID to sign
targets:
  InvoiceMaker:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../public/index.html # the same page as the website and the Android app
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Invoice Maker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleURLTypes:
          - CFBundleURLName: app.invoicemaker
            CFBundleURLSchemes: [invoicemaker]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/InvoiceMaker.entitlements
      properties:
        com.apple.security.application-groups: [group.app.invoicemaker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invoicemaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: InvoiceWidget
  InvoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Invoice Maker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/InvoiceWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.invoicemaker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invoicemaker.widget
        TARGETED_DEVICE_FAMILY: "1,2"
